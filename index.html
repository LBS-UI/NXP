<!-- QR container (put this in your HTML body) -->
<div id="qrContainer" style="display:none; text-align:center; margin-top:1rem;">
  <h3 style="margin:0 0 0.5rem;font-size:1.1rem">Share this image</h3>
  <div id="qrcode"></div>
  <p style="margin:0.75rem 0 0.25rem;font-size:0.9rem;color:#9aa0aa">
    Scan the QR code with any phone camera. It opens the image in the browser so anyone can save it.
  </p>
  <p style="margin:0.5rem 0 0;font-size:0.9rem">
    Or open / share this direct link:<br>
    <a id="imageLink" href="#" target="_blank" rel="noopener" style="color:#93c5fd;word-break:break-all"></a>
  </p>
  <div style="margin-top:0.75rem">
    <img id="imagePreview" alt="Uploaded image preview" style="max-width:100%;max-height:240px;border-radius:8px;display:none" />
  </div>
</div>

<button id="generateQRBtn" class="primary" disabled>Upload Image &amp; Generate QR</button>
<button id="retryUploadBtn" class="secondary" style="display:none">Retry Upload</button>
<button id="downloadQRBtn" class="secondary" disabled style="display:none">Download QR</button>

<!-- Load the QR library -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script>
const CF_WORKER_URL = "YOUR_WORKER_URL_HERE";   // leave as-is for demo mode

const qrContainer = document.getElementById("qrContainer");
const qrcodeEl = document.getElementById("qrcode");
const generateQRBtn = document.getElementById("generateQRBtn");
const retryUploadBtn = document.getElementById("retryUploadBtn");
const downloadQRBtn = document.getElementById("downloadQRBtn");

/* ---------- Upload helpers ---------- */
async function uploadToCloudflare(blob, ext) {
  const urlRes = await fetch(`${CF_WORKER_URL}/api/upload-url`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ contentType: blob.type })
  });
  if (!urlRes.ok) {
    let errBody = await urlRes.text();
    try { errBody = JSON.stringify(JSON.parse(errBody), null, 2); } catch (_) {}
    throw new Error(`Requesting upload URL failed (${urlRes.status}): ${errBody}`);
  }
  const data = await urlRes.json();
  if (!data.uploadURL || !data.publicURL) throw new Error("Worker response missing uploadURL or publicURL");

  const form = new FormData();
  form.append("file", new File([blob], `snapstudio.${ext}`, { type: blob.type }));
  const uploadRes = await fetch(data.uploadURL, { method: "POST", body: form });
  if (!uploadRes.ok) {
    let detail = `status ${uploadRes.status}`;
    try {
      const j = await uploadRes.json();
      if (j.errors) detail += " — " + JSON.stringify(j.errors);
    } catch (_) {}
    throw new Error(`Cloudflare upload failed: ${detail}`);
  }
  return { publicURL: data.publicURL, provider: "Cloudflare Images" };
}

async function uploadToTemporaryHost(blob, ext) {
  const form = new FormData();
  form.append("reqtype", "fileupload");
  form.append("time", "1h");
  form.append("fileToUpload", new File([blob], `snapstudio.${ext}`, { type: blob.type }));

  const res = await fetch("https://litterbox.catbox.moe/resources/internals/api.php", {
    method: "POST",
    body: form
  });
  if (!res.ok) throw new Error(`Temporary upload failed (${res.status})`);

  const publicURL = (await res.text()).trim();
  if (!publicURL.startsWith("http")) throw new Error("Temporary host returned an invalid URL: " + publicURL);
  return { publicURL, provider: "temporary host (litterbox.catbox.moe)" };
}

/* ---------- Show the QR on the page ---------- */
function showQR(publicURL, provider) {
  qrcodeEl.innerHTML = "";
  try {
    new QRCode(qrcodeEl, {
      text: publicURL,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch (err) {
    console.error(err);
    throw new Error("Failed to generate QR code: " + err.message);
  }

  const linkEl = document.getElementById("imageLink");
  linkEl.href = publicURL;
  linkEl.textContent = publicURL;

  const previewEl = document.getElementById("imagePreview");
  previewEl.src = publicURL;
  previewEl.style.display = "block";

  qrContainer.style.display = "block";
  downloadQRBtn.style.display = "inline-block";
  downloadQRBtn.disabled = false;
  qrContainer.scrollIntoView({ behavior: "smooth", block: "center" });
}

/* ---------- Main generate function ---------- */
async function generateQR() {
  generateQRBtn.disabled = true;
  retryUploadBtn.style.display = "none";
  try {
    // Assumes you already have a canvas with the photo and a getImageBlob() helper
    if (typeof QRCode === "undefined") throw new Error("QRCode library failed to load");

    const blob = await getImageBlob();   // ← your existing function that returns a Blob
    const ext = blob.type === "image/jpeg" ? "jpg" : blob.type.split("/")[1];

    let result;
    const useCloudflare = CF_WORKER_URL && CF_WORKER_URL !== "YOUR_WORKER_URL_HERE";

    if (useCloudflare) {
      result = await uploadToCloudflare(blob, ext);
    } else {
      try {
        result = await uploadToTemporaryHost(blob, ext);
      } catch (uploadErr) {
        console.error(uploadErr);
        throw new Error(
          "Demo upload failed (network or CORS block). " +
          "Set up the Cloudflare Worker for reliable sharing, or use the Download Image button."
        );
      }
    }

    showQR(result.publicURL, result.provider);
  } catch (err) {
    console.error(err);
    alert(err.message || "Upload failed");
    retryUploadBtn.style.display = "inline-block";
  } finally {
    generateQRBtn.disabled = false;
  }
}

/* ---------- Wire the buttons ---------- */
generateQRBtn.addEventListener("click", generateQR);
retryUploadBtn.addEventListener("click", generateQR);

downloadQRBtn.addEventListener("click", () => {
  const img = qrcodeEl.querySelector("img");
  const canvas = qrcodeEl.querySelector("canvas");
  const src = img ? img.src : (canvas ? canvas.toDataURL("image/png") : null);
  if (!src) return;
  const a = document.createElement("a");
  a.href = src;
  a.download = `snapstudio-qr-${Date.now()}.png`;
  a.click();
});
</script>
